name: Stiahnuť supabase-js do assets/vendor

# Jednorazovo stiahne pripnutú verziu supabase-js z jsDelivr a commitne ju do repa.
# Spustí sa po pushi, ak súbor ešte chýba, alebo ručne (Actions → Run workflow).
on:
  push:
    branches: [security-legal-fix, main]
    paths: ['.github/workflows/vendor-supabase.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  SB_VERSION: 2.118.0

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stiahnuť a overiť
        run: |
          set -eu
          mkdir -p assets/vendor
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SB_VERSION}/dist/umd/supabase.js" -o assets/vendor/supabase.js
          size=$(stat -c%s assets/vendor/supabase.js)
          echo "veľkosť: $size B"
          test "$size" -gt 100000
          grep -q "createClient" assets/vendor/supabase.js
          sha256sum assets/vendor/supabase.js | tee assets/vendor/supabase.js.sha256
          echo "supabase-js v${SB_VERSION} — https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SB_VERSION}/dist/umd/supabase.js" > assets/vendor/VERSION.txt
          rm -f assets/vendor/STIAHNI-supabase.js.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vendor
          git diff --cached --quiet && { echo "nič nové"; exit 0; }
          git commit -m "Pridať supabase-js v${SB_VERSION} (lokálna kópia)"
          git push
