name: Stiahnuť supabase-js do assets/vendor

# Stiahne pripnutú verziu supabase-js z jsDelivr, overí jej SHA-256 oproti
# očakávanej hodnote a commitne ju do repa. Spúšťa sa ručne (Actions → Run workflow)
# alebo po zmene tohto súboru (napr. pri zvýšení verzie).
#
# Aktualizácia na novú verziu:
#   1) zmeň SB_VERSION,
#   2) zisti hash novej verzie (lokálne: curl -sL <url> | sha256sum, alebo porovnaj
#      s `npm pack @supabase/supabase-js@<verzia>` → dist/umd/supabase.js),
#   3) zapíš ho do SB_SHA256 a commitni — workflow sa spustí sám.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-supabase.yml']
  workflow_dispatch:

permissions: {}

env:
  SB_VERSION: 2.118.0
  SB_SHA256: ee3be8de192b97cb1d73d1e95d6b82bb1f6b658c0f97c4ef757fc331996ed3d3

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stiahnuť a overiť
        run: |
          set -eu
          mkdir -p assets/vendor
          url="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SB_VERSION}/dist/umd/supabase.js"
          curl -fsSL "$url" -o assets/vendor/supabase.js
          echo "${SB_SHA256}  assets/vendor/supabase.js" | sha256sum -c -
          grep -q "createClient" assets/vendor/supabase.js
          sha256sum assets/vendor/supabase.js > assets/vendor/supabase.js.sha256
          echo "supabase-js v${SB_VERSION} — ${url}" > assets/vendor/VERSION.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vendor
          git diff --cached --quiet && { echo "nič nové"; exit 0; }
          git commit -m "Aktualizovať supabase-js na v${SB_VERSION}"
          git push
